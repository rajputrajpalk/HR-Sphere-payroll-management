# ============================================================================
# HR Sphere SaaS Application Configuration
# ============================================================================

# Embedded Web Server Settings
server:
  address: 0.0.0.0
  port: ${PORT:10000}
# ============================================================================
# Spring Core & Persistence Settings
# ============================================================================
spring:
  application:
    name: hr-sphere

  # H2 Database Connection Settings
  datasource:
    # Storage file is persisted at ./data/hrspheredb.mv.db
    # AUTO_SERVER=TRUE allows concurrent external connections
    url: jdbc:h2:file:./data/hrspheredb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password: sa

  # H2 Web Console
  h2:
    console:
      enabled: true
      path: /h2-console

  # Spring Data JPA & Hibernate ORM
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # Thymeleaf
  thymeleaf:
    cache: false

# ============================================================================
# Application Logging Settings
# ============================================================================
logging:
  level:
    root: INFO
    org.springframework.security: INFO
    com.hr.sphere: INFO