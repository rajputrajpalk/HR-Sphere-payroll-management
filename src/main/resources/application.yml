# ============================================================================
# HR Sphere SaaS Application Configuration
# ============================================================================

# Embedded Web Server Settings
server:
  port: 8080

# Spring Core & Persistence Settings
spring:
  application:
    name: hr-sphere

  # H2 Database Connection Settings (Persistent Local File Mode)
  datasource:
    # Storage file is persisted at ./data/hrspheredb.mv.db
    # AUTO_SERVER=TRUE allows concurrent external connections (e.g. H2 Web Console, DBeaver)
    url: jdbc:h2:file:./data/hrspheredb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password: sa

  # Interactive H2 Web Console Configuration
  h2:
    console:
      enabled: true
      path: /h2-console

  # Spring Data JPA & Hibernate ORM Settings
  jpa:
    hibernate:
      # Auto-creates/updates tables matching JPA Entity models on startup without wiping data
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # Thymeleaf Template Engine Configuration
  thymeleaf:
    cache: false # Disabled for instant UI template hot-reloading during development

# Application Logging Settings
logging:
  level:
    root: INFO
    org.springframework.security: INFO
    com.hr.sphere: INFO
